- name: Install Jenkins
  hosts: all
  become: yes
  tasks:
    - name: Install Java
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes

    - name: Add Jenkins GPG key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        state: present

    - name: Add Jenkins repository
      apt_repository:
        repo: 'deb https://pkg.jenkins.io/debian-stable binary/'
        state: present
        filename: jenkins

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Start and enable Jenkins
      systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Wait for Jenkins to start
      wait_for:
        port: 8080
        timeout: 300
        delay: 10

    - name: Wait for initial admin password file
      wait_for:
        path: /var/lib/jenkins/secrets/initialAdminPassword
        timeout: 300

    - name: Get Jenkins initial admin password
      slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_admin_pwd

    - name: Save Jenkins password to file
      copy:
        content: "{{ jenkins_admin_pwd.content | b64decode }}"
        dest: /home/ubuntu/jenkins-initial-password.txt
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Display Jenkins information
      debug:
        msg:
          - "Jenkins is running on port 8080"
          - "Initial admin password saved to /home/ubuntu/jenkins-initial-password.txt"
          - "Password: {{ jenkins_admin_pwd.content | b64decode }}"