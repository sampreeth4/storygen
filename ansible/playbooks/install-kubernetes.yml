- name: Install Kubernetes (K3s - lightweight for t3.micro)
  hosts: all
  become: yes
  tasks:
    - name: Download K3s installation script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install K3s
      shell: |
        INSTALL_K3S_EXEC="--disable=traefik" /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy kubeconfig for ubuntu user
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        remote_src: yes

    - name: Update kubeconfig server address
      replace:
        path: /home/ubuntu/.kube/config
        regexp: '127.0.0.1'
        replace: "{{ ansible_default_ipv4.address }}"
      become: yes
      become_user: ubuntu

    - name: Add kubectl alias
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'alias k=kubectl'
        create: yes

    - name: Verify K3s installation
      shell: k3s kubectl get nodes
      register: k3s_nodes
      changed_when: false

    - name: Display K3s status
      debug:
        msg: "{{ k3s_nodes.stdout_lines }}"